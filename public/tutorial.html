<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0A" />
<title>KDER Club — Interactive Tour</title>
<style>
  :root{
    --bg:#0A0A0A; --bg2:#121212; --panel:#161616; --ink:#fff;
    --dim:rgba(255,255,255,.6); --faint:rgba(255,255,255,.36);
    --line:rgba(255,255,255,.09); --green:#1B5E20; --lit:#37C871; --lit2:#4ADE80;
    --blue:#635BFF; /* stripe */ --uber:#000;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh}
  a{color:inherit}

  /* ---------- top bar ---------- */
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
    padding:14px 22px;background:rgba(10,10,10,.82);backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--line)}
  .brand{font-size:20px;font-weight:900;letter-spacing:-.04em}
  .brand .o{color:var(--lit)}
  .brand small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-top:-2px}
  .seg{display:flex;gap:4px;margin:0 auto;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:4px;border-radius:99px}
  .seg button{border:none;background:none;color:var(--dim);font-size:13.5px;font-weight:700;padding:8px 16px;border-radius:99px;cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:background .15s,color .15s}
  .seg button .e{font-size:15px}
  .seg button.on{background:var(--ink);color:#0A0A0A}
  .restart{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);font-size:12.5px;font-weight:700;
    padding:9px 15px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .restart svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
  @media(max-width:760px){.top{flex-wrap:wrap;gap:10px;padding:12px 14px}.seg{order:3;width:100%;margin:0;justify-content:space-between}
    .seg button{flex:1;justify-content:center;padding:9px 6px;font-size:12.5px}.restart{margin-left:auto}}

  /* ---------- layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px;display:grid;grid-template-columns:248px 1fr;gap:30px}
  @media(max-width:920px){.wrap{grid-template-columns:1fr;gap:20px}}

  /* ---------- TOC rail ---------- */
  .rail{position:sticky;top:96px;align-self:start;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:14px;max-height:calc(100dvh - 120px);overflow:auto}
  .rail h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800;padding:6px 8px 10px}
  .toc{list-style:none;display:flex;flex-direction:column;gap:2px}
  .toc li{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--dim);transition:background .14s,color .14s}
  .toc li:hover{background:rgba(255,255,255,.04);color:var(--ink)}
  .toc li.on{background:rgba(55,200,113,.13);color:var(--ink)}
  .toc .num{flex:0 0 24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;background:rgba(255,255,255,.08);color:var(--dim)}
  .toc li.on .num{background:var(--lit);color:#0A0A0A}
  .toc li.done .num{background:rgba(55,200,113,.2);color:var(--lit)}
  .toc li.done .num::after{content:"✓"}
  .toc li.done .num span{display:none}
  @media(max-width:920px){.rail{position:static;max-height:none;display:flex;flex-direction:column}
    .toc{flex-direction:row;overflow:auto;gap:6px;padding-bottom:4px}
    .toc li{flex:0 0 auto;white-space:nowrap}}

  /* ---------- stage ---------- */
  .stage{min-width:0}
  .stage-grid{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:start}
  @media(max-width:680px){.stage-grid{grid-template-columns:1fr;gap:24px;justify-items:center}}

  /* phone */
  .device{position:relative;width:300px;flex:0 0 300px;border-radius:42px;background:#000;
    padding:11px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);margin:0 auto}
  .notch{position:absolute;top:17px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#000;border-radius:99px;z-index:6}
  .screen{position:relative;height:600px;border-radius:33px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
  .statusbar{height:40px;flex:0 0 40px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;font-size:12px;font-weight:700}
  .statusbar .r{display:flex;gap:5px;align-items:center;opacity:.9}
  .statusbar .r svg{width:15px;height:11px;fill:#fff}
  .view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  .view::-webkit-scrollbar{display:none}
  .anim{animation:sIn .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes sIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* narration */
  .narr{min-width:0}
  .tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 12px;border-radius:99px;background:rgba(55,200,113,.13);color:var(--lit);border:1px solid rgba(55,200,113,.3)}
  .narr h2{font-size:29px;font-weight:850;letter-spacing:-.03em;line-height:1.1;margin:16px 0 0}
  @media(max-width:680px){.narr h2{font-size:24px}}
  .narr .lead{font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.82);margin-top:14px}
  .points{list-style:none;margin-top:20px;display:flex;flex-direction:column;gap:13px}
  .points li{display:flex;gap:12px;font-size:14px;line-height:1.45;color:rgba(255,255,255,.86)}
  .points li svg{flex:0 0 19px;width:19px;height:19px;margin-top:1px;stroke:var(--lit);fill:none;stroke-width:2.2}
  .points li b{color:#fff;font-weight:700}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  .mtag{font-size:11.5px;font-weight:700;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:6px 11px;border-radius:99px}
  .mtag.stripe{color:#a9a4ff;border-color:rgba(99,91,255,.35);background:rgba(99,91,255,.12)}
  .preview{font-size:11px;font-weight:800;color:#f5c451;background:rgba(245,196,81,.1);border:1px solid rgba(245,196,81,.3);padding:6px 11px;border-radius:99px}

  /* controls */
  .controls{display:flex;align-items:center;gap:14px;margin-top:30px}
  .nav-btn{display:flex;align-items:center;gap:8px;border:none;cursor:pointer;font-size:14.5px;font-weight:800;padding:13px 22px;border-radius:99px;transition:transform .15s,filter .15s,opacity .15s}
  .nav-btn:active{transform:scale(.97)}
  .nav-btn.next{background:var(--green);color:#fff;box-shadow:0 8px 22px rgba(27,94,32,.5)}
  .nav-btn.back{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line)}
  .nav-btn[disabled]{opacity:.35;cursor:not-allowed}
  .nav-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.18);transition:width .2s,background .2s}
  .dots i.on{width:20px;background:var(--lit)}
  @media(max-width:680px){.dots{display:none}}

  /* ============ in-screen UI primitives ============ */
  .s-pad{padding:18px 18px 30px}
  .s-logo{font-size:24px;font-weight:900;letter-spacing:-.04em;text-align:center;margin:18px 0 6px}
  .s-logo .o{color:var(--lit)}
  .s-h{font-size:20px;font-weight:850;letter-spacing:-.02em;margin-top:14px}
  .s-sub{font-size:12.5px;color:var(--dim);margin:14px 0 7px;font-weight:600}
  .s-input{height:48px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;align-items:center;padding:0 15px;font-size:15px;font-weight:600}
  .s-input.ph{color:var(--faint)}
  .otp{display:flex;gap:8px;margin:16px 0}
  .otp span{flex:1;aspect-ratio:1/1.15;border-radius:12px;background:rgba(255,255,255,.07);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
  .otp span.f{border-color:rgba(74,222,128,.55)}
  .otp span.cur{border-color:var(--lit);box-shadow:0 0 0 3px rgba(55,200,113,.15)}
  .s-btn{width:100%;height:50px;border-radius:99px;border:none;background:var(--green);color:#fff;font-size:15px;font-weight:800;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 22px rgba(27,94,32,.45);cursor:default}
  .s-btn.lite{background:#fff;color:#0A0A0A;box-shadow:none}
  .s-btn.stripe{background:var(--blue);box-shadow:0 8px 22px rgba(99,91,255,.4)}
  .s-btn.dark{background:#000;border:1px solid rgba(255,255,255,.2);box-shadow:none}
  .s-fine{font-size:11px;color:var(--faint);text-align:center;margin-top:14px;line-height:1.5}
  .s-fine b{color:var(--dim)}

  /* cover/profile (storefront) */
  .s-cover{height:120px;position:relative;background:linear-gradient(135deg,#3a2a1a,#1a1a1a)}
  .s-cover img{width:100%;height:100%;object-fit:cover}
  .s-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(10,10,10,.85))}
  .s-prof{padding:0 16px;margin-top:-30px;position:relative;z-index:2}
  .s-av{width:60px;height:60px;border-radius:99px;padding:2.5px;background:linear-gradient(135deg,var(--lit),var(--green))}
  .s-av img,.s-av div{width:100%;height:100%;border-radius:99px;object-fit:cover;background:#2a2a2a;display:block}
  .s-name{font-size:18px;font-weight:850;letter-spacing:-.02em;margin-top:9px;display:flex;align-items:center;gap:6px}
  .s-name .v{width:15px;height:15px;flex:0 0 15px}
  .s-handle{font-size:12px;color:var(--dim);margin-top:2px}
  .s-meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);margin-top:9px;font-weight:600}
  .s-meta .star{color:var(--lit);display:flex;align-items:center;gap:3px;font-weight:800}
  .s-meta svg{width:12px;height:12px;fill:var(--lit)}
  .s-meta .d{width:3px;height:3px;border-radius:99px;background:var(--faint)}
  .s-links{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
  .s-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
  .s-chip svg{width:12px;height:12px}

  /* generic section label */
  .s-lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:18px 16px 8px}

  /* plate rows */
  .plate-r{display:flex;gap:12px;padding:12px 16px;align-items:center}
  .plate-r+.plate-r{border-top:1px solid var(--line)}
  .pr-info{flex:1;min-width:0}
  .pr-n{font-size:14px;font-weight:750;letter-spacing:-.01em}
  .pr-d{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pr-p{font-size:13.5px;font-weight:800;margin-top:6px}
  .pr-th{position:relative;flex:0 0 72px}
  .pr-th img,.pr-th div{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#2a2a2a}
  .pr-add{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:99px;background:#fff;color:#0A0A0A;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.5)}
  .pr-add svg{width:15px;height:15px;stroke:#0A0A0A;stroke-width:2.6;fill:none}
  .badge{position:absolute;top:6px;left:6px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:3px 7px;border-radius:7px;background:var(--green);color:#fff}

  /* cards row (catering / recs) */
  .pkg-c{margin:10px 16px;padding:13px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .pkg-c .sv{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--lit)}
  .pkg-c .nm{font-size:14.5px;font-weight:800;margin-top:4px}
  .pkg-c .ds{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4}
  .pkg-c .pc{font-size:14px;font-weight:850;margin-top:8px}
  .pkg-c .pc small{color:var(--dim);font-weight:600}

  /* checkout */
  .ord-line{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:13.5px}
  .ord-line+.ord-line{border-top:1px solid var(--line)}
  .ord-line .q{color:var(--dim);font-weight:600}
  .ord-line b{font-weight:800}
  .ord-sum{margin:6px 16px;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .ord-sum .l{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);padding:4px 0}
  .ord-sum .l.tot{color:#fff;font-weight:850;font-size:15px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
  .terms{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:12px;color:var(--dim);line-height:1.4}
  .terms .box{flex:0 0 20px;width:20px;height:20px;border-radius:6px;background:var(--green);display:flex;align-items:center;justify-content:center}
  .terms .box svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none}
  .terms a{color:var(--lit);text-decoration:underline}

  /* delivery / uber direct */
  .map{height:200px;position:relative;background:
    radial-gradient(circle at 30% 35%,rgba(55,200,113,.18),transparent 40%),
    linear-gradient(135deg,#16201a,#0e120f);overflow:hidden}
  .map .route{position:absolute;left:20%;top:78%;width:60%;height:2px;background:repeating-linear-gradient(90deg,var(--lit) 0 8px,transparent 8px 16px);transform:rotate(-28deg);transform-origin:left}
  .map .pin{position:absolute;width:30px;height:30px;border-radius:99px 99px 99px 0;transform:rotate(45deg);box-shadow:0 6px 14px rgba(0,0,0,.5)}
  .map .pin.a{left:18%;top:70%;background:#fff}
  .map .pin.b{right:18%;top:30%;background:var(--lit)}
  .map .pin span{display:block;transform:rotate(-45deg);text-align:center;line-height:30px;font-size:13px}
  .courier{margin:-26px 14px 0;position:relative;z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
  .courier .ch{display:flex;align-items:center;gap:11px}
  .courier .ca{width:42px;height:42px;border-radius:99px;background:#2a2a2a;flex:0 0 42px;overflow:hidden}
  .courier .ca img{width:100%;height:100%;object-fit:cover}
  .courier .cn{flex:1}
  .courier .cn b{font-size:14px;font-weight:800}
  .courier .cn span{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
  .courier .eta{text-align:right}
  .courier .eta b{font-size:18px;font-weight:850;color:var(--lit)}
  .courier .eta span{display:block;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .steps-t{margin:14px 0 0;display:flex;flex-direction:column;gap:0}
  .st-r{display:flex;gap:11px;align-items:flex-start;padding:8px 0;position:relative}
  .st-r .dot{flex:0 0 16px;width:16px;height:16px;border-radius:99px;border:2px solid var(--line);margin-top:1px}
  .st-r.ok .dot{background:var(--lit);border-color:var(--lit)}
  .st-r.now .dot{border-color:var(--lit);box-shadow:0 0 0 4px rgba(55,200,113,.18)}
  .st-r .tx b{font-size:13px;font-weight:750;display:block}
  .st-r .tx span{font-size:11px;color:var(--faint)}
  .uberbar{margin:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--dim);font-weight:700}
  .uberbar .ud{background:#000;border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:800;padding:4px 9px;border-radius:6px;font-size:11px}

  /* rating */
  .rate-head{text-align:center;padding:22px 18px 4px}
  .rate-head .av{width:62px;height:62px;border-radius:99px;margin:0 auto 12px;background:#2a2a2a;overflow:hidden}
  .rate-head .av img{width:100%;height:100%;object-fit:cover}
  .rate-head h4{font-size:18px;font-weight:850}
  .rate-head p{font-size:12px;color:var(--dim);margin-top:4px}
  .rate-dim{padding:14px 18px;border-top:1px solid var(--line);margin-top:8px}
  .rate-dim:first-of-type{border-top:none}
  .rate-dim .dn{font-size:13.5px;font-weight:750;display:flex;justify-content:space-between}
  .rate-dim .dn small{color:var(--faint);font-weight:600}
  .stars{display:flex;gap:7px;margin-top:9px}
  .stars svg{width:26px;height:26px;fill:var(--lit)}
  .stars svg.off{fill:rgba(255,255,255,.14)}

  /* chat (Mia) */
  .chat-top{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .mia-av{width:38px;height:38px;border-radius:99px;background:linear-gradient(135deg,var(--lit2),var(--green));display:flex;align-items:center;justify-content:center;flex:0 0 38px}
  .mia-av svg{width:20px;height:20px;fill:#0A0A0A}
  .chat-top .ci b{font-size:14.5px;font-weight:850;display:flex;align-items:center;gap:6px}
  .chat-top .ci span{font-size:11px;color:var(--lit);font-weight:700}
  .chat-body{padding:16px;display:flex;flex-direction:column;gap:12px}
  .bub{max-width:82%;padding:11px 14px;border-radius:18px;font-size:13px;line-height:1.45}
  .bub.u{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:5px}
  .bub.m{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bub.m b{color:var(--lit2)}
  .rec{display:flex;gap:10px;align-self:flex-start;width:88%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:9px;margin-top:-2px}
  .rec img,.rec .ph{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:0 0 46px;background:#2a2a2a}
  .rec .rn{font-size:12.5px;font-weight:800}
  .rec .rd{font-size:10.5px;color:var(--dim);margin-top:2px}
  .rec .rp{font-size:12px;font-weight:850;color:var(--lit);margin-top:4px}
  .chips-row{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 14px}
  .qchip{font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:99px;background:rgba(55,200,113,.1);border:1px solid rgba(55,200,113,.28);color:var(--lit)}

  /* analytics (Cleopatra) */
  .cleo-top{display:flex;align-items:center;gap:11px;padding:16px 16px 6px}
  .cleo-av{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#f5c451,#b8862f);display:flex;align-items:center;justify-content:center;flex:0 0 40px}
  .cleo-av svg{width:22px;height:22px;fill:#1a1206}
  .cleo-top b{font-size:15px;font-weight:850;letter-spacing:-.01em;display:block}
  .cleo-top span{font-size:11px;color:#f5c451;font-weight:700}
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px}
  .kpi{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;padding:11px 9px;text-align:center}
  .kpi .v{font-size:17px;font-weight:850;letter-spacing:-.02em}
  .kpi .v.g{color:var(--lit)}
  .kpi .l{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .kpi .up{font-size:9.5px;color:var(--lit);font-weight:800;margin-top:3px}
  .chart{margin:8px 16px;padding:14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .chart .ct{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
  .bars{display:flex;align-items:flex-end;gap:7px;height:96px}
  .bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}

  /* payout (stripe) */

  /* email */

  /* creator order mgmt */

  .reveal{margin:0 16px 16px;padding:12px 14px;border-radius:13px;background:rgba(55,200,113,.08);border:1px solid rgba(55,200,113,.25);display:flex;gap:10px;align-items:center;font-size:12px;color:rgba(255,255,255,.88)}
  .reveal svg{width:17px;height:17px;stroke:var(--lit);fill:none;stroke-width:2;flex:0 0 17px}

  /* list-plate form */
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:14px 16px}
  .photos .ph{aspect-ratio:1;border-radius:11px;background:rgba(255,255,255,.05);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}

  .photos .ph svg{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2}

  .fld .fv{height:42px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);display:flex;align-items:center;padding:0 13px;font-size:14px;font-weight:650;margin-top:6px}
  .fld2{display:flex;gap:9px}
  .fld2 .fld{flex:1;padding-left:0;padding-right:0}
  .pub{display:flex;align-items:center;justify-content:space-between;margin:8px 16px;padding:12px 14px;border-radius:13px;background:rgba(55,200,113,.08);border:1px solid rgba(55,200,113,.25)}
  .pub b{font-size:13px;font-weight:800}
  .pub .tg{width:42px;height:24px;border-radius:99px;background:var(--lit);position:relative}
  .pub .tg::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:99px;background:#fff}

  /* checklist (restaurant onboard) */
  .check{margin:14px 16px;display:flex;flex-direction:column;gap:0}
  .ck{display:flex;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}

  .ck.ok .ct b{color:#fff}
  .ck.todo .ct b{color:var(--dim)}

  /* bulk menu */
  .bulk-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
  .bulk-top b{font-size:15px;font-weight:850}
  .imp{font-size:11px;font-weight:800;color:var(--lit);background:rgba(55,200,113,.12);border:1px solid rgba(55,200,113,.3);padding:7px 11px;border-radius:99px;display:flex;align-items:center;gap:5px}
  .imp svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4}

  /* completion */
  .done-card{text-align:center;padding:40px 30px}
  .done-card .ring{width:84px;height:84px;border-radius:99px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;background:rgba(55,200,113,.14);border:1.5px solid rgba(55,200,113,.5)}
  .done-card .ring svg{width:40px;height:40px;stroke:var(--lit);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  .done-card p{font-size:14.5px;color:var(--dim);margin-top:10px;line-height:1.55}

  .done-card .jump button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:13px;font-weight:750;padding:11px 18px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:7px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script id="tourData">
(function(){

  function scCheckout(){return `<div class="s-pad" style="padding-top:8px">

      {icon:'🚗',label:'Delivery',tag:'Delivery',title:'Delivery via Uber Direct',
        lead:'Offer courier delivery without your own drivers. Uber Direct quotes at checkout and auto-dispatches when you accept.',
        points:[P('<b>Live courier quotes</b> at checkout'),P('Auto-dispatch on accept, <b>live-tracked</b>'),P('Pickup always available too')],
        meta:[meta('Uber Direct'),meta('Sandbox','preview')], screen:scDelivery()},
      {icon:'💸',label:'Payouts',tag:'Payouts',title:'Payouts, fees & 1099',
        lead:'Same Stripe rails: keep 90% on a flat 10% platform fee, free standard or 1% instant payouts, and automated tax forms for your business.',
        points:[P('Keep <b>90%</b> — flat <b>10% platform fee</b>, server-side'),P('Standard (free) or <b>Instant (1%)</b>'),P('<b>1099 filed automatically</b>')],
        meta:[meta('Stripe Connect','stripe'),meta('Auto 1099','stripe')], screen:scPayout()},
      {icon:'📊',label:'Cleo VII',tag:'Analytics',title:'Ops analytics with Cleopatra VII',
        lead:'See peak days, top items and revenue trends — then export for your accountant. Cleo flags what to do next.',
        points:[P('GMV, order & AOV KPIs by period'),P('Peak-day & top-item insights'),P('<b>Export CSV</b> for your books')],
        meta:[meta('Cleopatra VII')], screen:scCleoDash()},
    ]}
  };

  /* ---------- state + render ---------- */
  let persona='member', idx=0;

  const view=$('#screenView'), toc=$('#toc'), railTitle=$('#railTitle'),
        tag=$('#stepTag'), title=$('#stepTitle'), lead=$('#stepLead'),
        pts=$('#stepPoints'), metaRow=$('#stepMeta'), dots=$('#dots'),
        backBtn=$('#backBtn'), nextBtn=$('#nextBtn');

  function buildTOC(){
    const steps=TOURS[persona].steps;
    railTitle.textContent=TOURS[persona].title;
    toc.innerHTML=steps.map((s,i)=>`<li data-i="${i}"><span class="num"><span>${i+1}</span></span>${s.label}</li>`).join('');
    toc.querySelectorAll('li').forEach(li=>li.addEventListener('click',()=>{idx=+li.dataset.i;render();}));
  }

  function render(){
    const tour=TOURS[persona], steps=tour.steps, last=idx===steps.length;
    // TOC states
    toc.querySelectorAll('li').forEach((li,i)=>{
      li.classList.toggle('on',i===idx);
      li.classList.toggle('done',i<idx);
    });
    if(last){
      // completion
      tag.textContent='Complete'; title.textContent='You\'ve seen the whole flow';
      lead.textContent=tour.done; pts.innerHTML=''; metaRow.innerHTML='';
      view.className='view'; view.innerHTML=scDone(tour.done);
      view.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{switchPersona(b.dataset.go);}));
    } else {
      const s=steps[idx];
      tag.textContent=s.tag; title.textContent=s.title; lead.textContent=s.lead;
      pts.innerHTML=s.points.map(p=>`<li>${CHK}<span>${p.html}</span></li>`).join('');
      metaRow.innerHTML=s.meta.map(m=>`<span class="${m.cls==='preview'?'preview':'mtag '+m.cls}">${m.text}</span>`).join('');
      view.className='view'; void view.offsetWidth; view.innerHTML='<div class="anim">'+s.screen+'</div>';
    }
    // dots
    dots.innerHTML=steps.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')+`<i class="${last?'on':''}"></i>`;
    backBtn.disabled=idx===0;
    nextBtn.innerHTML = last
      ? 'Restart<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3M3 4v4h4"/></svg>'
      : 'Next<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>';
    view.scrollTop=0;
  }

  function switchPersona(p){
    persona=p; idx=0;
    document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
    buildTOC(); render();
  }

  /* ---------- events ---------- */
  document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click',()=>switchPersona(b.dataset.p)));
  $('#restart').addEventListener('click',()=>{idx=0;render();});
  backBtn.addEventListener('click',()=>{if(idx>0){idx--;render();}});
  nextBtn.addEventListener('click',()=>{
    const len=TOURS[persona].steps.length;
    if(idx>=len){idx=0;} else {idx++;}
    render();
  });

  // live clock
  function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
  tick(); setInterval(tick,30000);

  buildTOC(); render();
})();
</script>
</body>
</html>
